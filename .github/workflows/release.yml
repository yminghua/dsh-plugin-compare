name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Install OIDC-capable npm CLI
        run: npm install --global npm@11.16.0
      - name: Require tag to match package version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - name: Select npm dist-tag
        id: npm-dist-tag
        run: |
          echo "tag=$(node -p 'require("./package.json").version.includes("-") ? "next" : "latest"')" >> "$GITHUB_OUTPUT"
      - name: Publish to npm
        run: |
          package_name=$(node -p 'require("./package.json").name')
          package_version=$(node -p 'require("./package.json").version')
          published=$(npm view "$package_name@$package_version" version --registry=https://registry.npmjs.org 2>/dev/null || true)
          if [ "$published" = "$package_version" ]; then
            echo "$package_name@$package_version is already published; skipping npm publish"
          else
            npm publish --provenance --tag "${{ steps.npm-dist-tag.outputs.tag }}"
          fi

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          args=(--verify-tag --generate-notes --title "$GITHUB_REF_NAME")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}" --repo "$GITHUB_REPOSITORY"
